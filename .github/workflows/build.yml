
name: Build ResumeMate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Removed cache: npm because no lockfile exists yet

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
